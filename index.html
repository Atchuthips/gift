<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gift Page</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="hero">

    <div class="overlay"></div>

    <header>

        <div class="gift">

            🎁 A Gift For U

        </div>

        <div class="from">

            From Atchuth

        </div>

    </header>

    <div class="hero-content">

        <img id="thumbnail">

        <h1 id="title"></h1>

	<p id="description"></p>



    </div>

</div>

<section class="letter">

    <h2>

        Dear <span id="recipient"></span>,

    </h2>

    <p id="message"></p>

    <div class="signature">

        Atchuth

    </div>

</section>

<section class="details">

<div class="detail">

<div class="label">

📅 Date

</div>

<div id="date"></div>

</div>

<div class="detail">

<div class="label">

🎁 Occasion

</div>

<div id="occasion"></div>

</div>

<div class="detail">

<div class="label">

⏱ Duration

</div>

<div id="duration"></div>

</div>

</section>



<div class="button-area">

    <a id="watchButton">

        ▶ Take me to my gift

    </a>

</div>

<footer>

Ideas are gifts that keep growing when shared. Handcrafted with ❤️ by Atchuth

</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
<script src="script.js"></script>

<script src="script.js"></script>

</body>

</html>
